# Voice pipeline backend. Standalone for now; can fold into the `hub` app
# as a process group later.
app = "jared-voice"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # always-on: it holds a live WebSocket
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
