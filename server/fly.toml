# Voice pipeline backend. Standalone for now; can fold into the `hub` app
# as a process group later.
app = "jared-voice"
primary_region = "iad"

[build]

# Live-tunable knobs (change here + redeploy, or `fly machine update --env KEY=VAL`).
[env]
  # Pin BLAS/OpenMP to 1 thread. On the shared 1-vCPU VM, torch/numpy default to spawning a thread per
  # host core, which oversubscribes the single core we're scheduled on and makes one ECAPA encode thrash
  # from ~0.2s up to 7-10s — past the 3.5s abort window, so real commands drop before the voiceprint
  # confirms you. These env vars cap the pools at import time; server.py also calls torch.set_num_threads(1).
  OMP_NUM_THREADS = "1"
  MKL_NUM_THREADS = "1"
  HANGOVER_S = "3.0"        # trailing-silence seconds before an utterance ends
  GAIN = "5"                # software boost: the ESP mic actually delivers LOW-level audio (~5k peak even
                            # up close), so 1x left speech buried at the noise floor and ECAPA couldn't match it.
                            # 5x brings a normal-voice peak to ~25k (under the 32767 clip). Tune if it clips.
  WAKE_MODEL = "hey_rhasspy" # openWakeWord pretrained name ("Hey Rhasspy")
  MAX_UTTERANCE_S = "600"   # absolute safety cap in seconds (10 min)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # always-on: it holds a live WebSocket
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # 2GB: wake-free lazy-loads the ECAPA speaker model (~1GB of torch) on top of whisper + openWakeWord
  # + the Claude SDK; 1GB OOM-kills the process when wake-free turns on (which drops the ESP → it
  # flashes its reconnect pattern). Keep this at 2gb so a deploy never resets it back down.
  memory = "2gb"
