name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # speechbrain (and the torch it pulls) is only imported when voice ID loads, which no test does.
      - run: |
          pip install -r worker/requirements-test.txt
          grep -v '^speechbrain' server/requirements.txt | pip install -r /dev/stdin
      - run: python -m pytest -q worker/tests server/tests

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      # pi-desk has no package.json; its modules are ES modules that node detects by syntax.
      - run: node --experimental-detect-module --test ../pi-desk/test/*.test.js
