# The desk tmux server (orchestrator/src/tmux.js). Read once, when the server starts.
# A session shown in a Terminal window is a tmux client: the wheel scrolls tmux's history (mouse off
# turns it into arrow keys, which Claude Code reads as prompt history), and the history has to be long
# enough to scroll back through a session's whole turn.
set -g mouse on
set -g history-limit 50000
set -g status off
